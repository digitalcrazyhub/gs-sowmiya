<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich Metallic Gold Gradient for Monogram -->
    <linearGradient id="gssbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BF77" />
      <stop offset="30%" stop-color="#FFE3A8" />
      <stop offset="55%" stop-color="#D8A95C" />
      <stop offset="85%" stop-color="#F3D089" />
      <stop offset="100%" stop-color="#BF9042" />
    </linearGradient>

    <!-- Warm Gold for Lines -->
    <linearGradient id="goldLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF9348" />
      <stop offset="50%" stop-color="#ECC67F" />
      <stop offset="100%" stop-color="#BF9348" />
    </linearGradient>

    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D8A95C" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="monogram" filter="url(#goldGlow)" stroke="url(#gssbGoldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Roman Pillars with Serifs -->
    <!-- Left Pillar -->
    <path d="M262 58 L262 250" stroke-width="6" />
    <!-- Left Pillar Top Serif -->
    <path d="M248 58 L276 58" stroke-width="4.5" />
    <!-- Left Pillar Bottom Serif -->
    <path d="M248 250 L276 250" stroke-width="4.5" />
    <path d="M253 64 L262 58 L271 64" stroke-width="3" fill="none" />
    <path d="M253 244 L262 250 L271 244" stroke-width="3" fill="none" />

    <!-- Right Pillar -->
    <path d="M338 58 L338 250" stroke-width="6" />
    <!-- Right Pillar Top Serif -->
    <path d="M324 58 L352 58" stroke-width="4.5" />
    <!-- Right Pillar Bottom Serif -->
    <path d="M324 250 L352 250" stroke-width="4.5" />
    <path d="M329 64 L338 58 L347 64" stroke-width="3" fill="none" />
    <path d="M329 244 L338 250 L347 244" stroke-width="3" fill="none" />

    <!-- Classical Arch Connectors at Top & Bottom -->
    <path d="M262 80 C285 68, 315 68, 338 80" stroke-width="4.5" fill="none" />
    <path d="M262 228 C285 240, 315 240, 338 228" stroke-width="4.5" fill="none" />

    <!-- Center Horizontal Crossbeam -->
    <path d="M240 154 L360 154" stroke-width="6.5" />
    <path d="M240 149 L240 159" stroke-width="4" />
    <path d="M360 149 L360 159" stroke-width="4" />

    <!-- Outer 'G' - Curving Left Wing of the Monogram -->
    <path d="M 300 68
             C 240 68, 188 104, 188 154
             C 188 204, 238 238, 290 238
             C 320 238, 336 228, 342 220"
          stroke-width="9" fill="none" />
    <path d="M 300 82
             C 255 82, 204 112, 204 154
             C 204 195, 250 224, 292 224"
          stroke-width="4" fill="none" />
    <!-- G Serif Head at Top -->
    <path d="M 292 61 L 308 75 L 292 89" stroke-width="3.5" fill="none" />

    <!-- Outer 'B' - Two Curving Right Lobes -->
    <!-- Top Lobe of B -->
    <path d="M 295 70
             C 365 70, 412 96, 412 124
             C 412 147, 375 154, 340 154"
          stroke-width="9" fill="none" />
    <path d="M 305 83
             C 355 83, 396 102, 396 124
             C 396 141, 365 146, 340 146"
          stroke-width="3.5" fill="none" />

    <!-- Bottom Lobe of B -->
    <path d="M 340 154
             C 385 154, 420 168, 420 196
             C 420 226, 368 238, 298 238"
          stroke-width="9" fill="none" />
    <path d="M 340 162
             C 375 162, 404 173, 404 196
             C 404 218, 360 226, 305 226"
          stroke-width="3.5" fill="none" />

    <!-- Intertwined 'S' Ribbons weaving through Pillars -->
    <path d="M 350 94
             C 325 79, 275 87, 262 109
             C 250 129, 275 145, 300 154
             C 335 166, 350 184, 342 204
             C 330 229, 275 234, 248 214"
          stroke-width="7.5" fill="none" />
    <path d="M 342 101
             C 320 89, 282 95, 272 111
             C 262 127, 282 139, 305 147
             C 342 159, 358 179, 350 201"
          stroke-width="3" fill="none" />
  </g>

  <!-- TYPOGRAPHY LAYER FOR DARK BACKGROUNDS -->
  <!-- Primary Title: GS SOWMIYA in pristine white -->
  <text x="300" y="352"
        text-anchor="middle"
        font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="48"
        font-weight="700"
        letter-spacing="0.08em"
        fill="#FFFFFF">GS SOWMIYA</text>

  <!-- Subtitle: BUILDERS PVT. LTD in warm ivory -->
  <text x="300" y="404"
        text-anchor="middle"
        font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="24"
        font-weight="600"
        letter-spacing="0.22em"
        fill="#E8E0D4">BUILDERS PVT. LTD</text>

  <!-- Tagline Row: Thin Gold Flanking Rules + Motto -->
  <g id="tagline-group">
    <line x1="65" y1="444" x2="135" y2="444" stroke="url(#goldLineGrad)" stroke-width="1.8" stroke-linecap="round" />
    
    <text x="300" y="449"
          text-anchor="middle"
          font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif"
          font-size="14.5"
          font-weight="600"
          letter-spacing="0.16em"
          fill="#D4B072">BUILT ON TRUST. DRIVEN BY QUALITY.</text>

    <line x1="465" y1="444" x2="535" y2="444" stroke="url(#goldLineGrad)" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
